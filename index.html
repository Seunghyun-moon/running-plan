        <span class="time-sep">:</span>

// ── VDOT ──────────────────────────────────────────────

function calcVDOT(distM, timeSec) {
  const t = timeSec / 60, v = distM / t;
  const pct = 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
  const vo2 = -4.60 + 0.182258 * v + 0.000104 * v * v;
  return Math.round(vo2 / pct * 10) / 10;
}

function paceSecFromFraction(vdot, frac) {
  const vo2 = vdot * frac;
  const a = 0.000104, b = 0.182258, c = -(4.60 + vo2);
  const v = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); // m/min
  return (1000 / v) * 60; // sec/km
}

function fmtPace(sec) {
  const m = Math.floor(sec / 60), s = Math.round(sec % 60);
  return `${m}:${String(s).padStart(2,'0')}`;
}

function fmtTime(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = Math.round(sec % 60);
  return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}` : `${m}:${String(s).padStart(2,'0')}`;
}

function getPaces(vdot) {
  return {
    easyF: paceSecFromFraction(vdot, 0.69),
    easyS: paceSecFromFraction(vdot, 0.51),
    tempoF: paceSecFromFraction(vdot, 0.84),
    tempoS: paceSecFromFraction(vdot, 0.79),
    intF: paceSecFromFraction(vdot, 1.00),
    intS: paceSecFromFraction(vdot, 0.95),
  };
}

function predictTime(vdot, distM, frac) {
  const sec = paceSecFromFraction(vdot, frac);
  return fmtTime(sec * distM / 1000);
}

// 기간 모드용 패턴 → 템플릿 변환
function patternToTemplate(pattern, targetDist) {
  const c = DIST_CFG[targetDist];
  const progressTypes = pattern.filter(t => t !== 'recover' && t !== 'taper');
  let pi = 0;
  return pattern.map(type => {
    if (type === 'recover') {
      return { t:'recover', lsd: Math.round(c.lsdS * 0.75), int: null, tempo: 0, easy: c.easy.t };
    }
    if (type === 'taper') {
      return { t:'taper',
        lsd:  Math.round(c.lsdP * 0.55),
        int:  c.ints[Math.min(1, c.ints.length - 1)],
        tempo: Math.round(c.tmP * 0.60),
        easy: c.easy.t };
    }
    const t = progressTypes.length > 1 ? pi / (progressTypes.length - 1) : 0.5;
    pi++;
    if (type === 'peak') {
      return { t:'peak',
        lsd:  lerpRound(c.lsdP * 0.85, c.lsdP, t),
        int:  c.ints[Math.min(c.ints.length-1, Math.floor(c.ints.length * 0.6 + t * c.ints.length * 0.4))],
        tempo: lerpRound(c.tmP * 0.85, c.tmP, t),
        easy: c.easy.p };
    }
    return { t:'build',
      lsd:  lerpRound(c.lsdS, c.lsdP * 0.82, t),
      int:  c.ints[Math.min(c.ints.length-1, Math.floor(t * c.ints.length * 0.65))],
      tempo: lerpRound(c.tmS, c.tmP * 0.82, t),
      easy: c.easy.b };
  });
}

         {t:'peak',  lsd:32,int:'1000m × 6세트',tempo:37,easy:60},
         {t:'taper', lsd:24,int:'800m × 4세트',tempo:28,easy:50},
         {t:'taper', lsd:16,int:'400m × 4세트',tempo:20,easy:40},
         {t:'taper', lsd:12,int:'200m × 4세트',tempo:15,easy:30}],
  },
};

const WEEKS_OPTIONS = [4, 6, 8, 10, 12]; // 기간 모드: 모든 거리 동일
const RACE_TYPE = { half:'하프마라톤', '10k':'10K 레이스', '5k':'5K 레이스', full:'풀마라톤' };
const RACE_FRAC = { half:0.85, '10k':0.92, '5k':0.97, full:0.80 };
const RACE_DIST = { half:21097, '10k':10000, '5k':5000, full:42195 };

const DAYS_KO = ['일','월','화','수','목','금','토'];

const MIN_TRAINING_WEEKS = { half: 3, '10k': 2, '5k': 2, full: 5 };

// 거리별 파라미터
const DIST_CFG = {
  half: { lsdS:12, lsdP:20, lsdT:10, tmS:18, tmP:30, tmT:15, easy:{ b:40, p:50, t:30 },
          ints:['400m × 5세트','400m × 8세트','800m × 5세트','800m × 6세트','1000m × 5세트'] },
  '10k': { lsdS:8,  lsdP:14, lsdT:7,  tmS:14, tmP:25, tmT:12, easy:{ b:35, p:40, t:25 },
           ints:['400m × 4세트','400m × 6세트','800m × 4세트','800m × 5세트','1000m × 4세트'] },
  '5k':  { lsdS:6,  lsdP:10, lsdT:5,  tmS:10, tmP:18, tmT:8,  easy:{ b:25, p:30, t:20 },
           ints:['200m × 4세트','400m × 4세트','400m × 6세트','800m × 4세트'] },
  full:  { lsdS:16, lsdP:32, lsdT:12, tmS:25, tmP:40, tmT:20, easy:{ b:50, p:60, t:40 },
           ints:['800m × 4세트','800m × 6세트','1000m × 5세트','1200m × 5세트','1000m × 6세트'] },
};

function lerpRound(a, b, t) { return Math.round(a + (b - a) * t); }

// 거리별 테이퍼 주수 기준 (과학적 근거)
const TAPER_WEEKS = { half: 2, '10k': 1, '5k': 1, full: 3 };

function generateDynamicTemplate(targetDist, numWeeks) {
  const c = DIST_CFG[targetDist];
  const maxTaper = TAPER_WEEKS[targetDist];
  // 전체 주수의 최대 25%, 최소 1주, 최대 maxTaper주
  const taper  = Math.min(maxTaper, Math.max(1, Math.floor(numWeeks * 0.22)));
  const recover = numWeeks >= 9 ? 1 : 0;
  const remaining = numWeeks - taper - recover;
  // 피크: 전체의 25~30%, 최소 1주, 최대 3주(단거리)/4주(풀)
  const maxPeak = targetDist === 'full' ? 4 : 3;
  const peak   = numWeeks <= 3 ? 0 : Math.min(maxPeak, Math.max(1, Math.floor(remaining * 0.3)));
  const build  = Math.max(1, remaining - peak);

  const weeks = [];

  for (let i = 0; i < build; i++) {
    const t = build > 1 ? i / (build - 1) : 0.5;
    const intIdx = Math.min(Math.floor(t * c.ints.length * 0.65), c.ints.length - 1);
    weeks.push({ t:'build',
      lsd:  lerpRound(c.lsdS, c.lsdP * 0.82, t),
      int:  c.ints[intIdx],
      tempo: lerpRound(c.tmS, c.tmP * 0.82, t),
      easy: c.easy.b });
  }

  if (recover) {
    weeks.push({ t:'recover', lsd: Math.round(c.lsdS * 0.85), int: null, tempo: 0, easy: c.easy.t });
  }

  for (let i = 0; i < peak; i++) {
    const t = peak > 1 ? i / (peak - 1) : 1;
    const intIdx = Math.min(Math.floor(c.ints.length * 0.55 + t * c.ints.length * 0.45), c.ints.length - 1);
    weeks.push({ t:'peak',
      lsd:  lerpRound(c.lsdP * 0.82, c.lsdP, t),
      int:  c.ints[intIdx],
      tempo: lerpRound(c.tmP * 0.82, c.tmP, t),
      easy: c.easy.p });
  }

  for (let i = 0; i < taper; i++) {
    // 첫 테이퍼: 60% 볼륨, 마지막 테이퍼: 40% 볼륨
    const t = taper > 1 ? i / (taper - 1) : 1;
    weeks.push({ t:'taper',
      lsd:  lerpRound(c.lsdP * 0.62, c.lsdT, t),
      int:  c.ints[0],
      tempo: lerpRound(c.tmT * 1.1, c.tmT * 0.75, t),
      easy: c.easy.t });
  }

  return weeks;
}


// 요일별 워크아웃 (dayOfWeek: 0=일, 1=월, 2=화, 3=수, 4=목, 5=금, 6=토)
function workoutForDay(dayOfWeek, wk, paces) {
  const { easyStr, tempoStr, intStr } = paces;
  if (wk.t === 'recover') {
    switch (dayOfWeek) {
      case 1: return ['휴식', '스트레칭 / 폼롤러'];
      case 2: return ['가벼운 조깅', `30분 / ${easyStr} / Zone 1`];
      case 3: return ['조깅', `${wk.easy}분 / Zone 2`];
      case 4: return ['가벼운 템포', `15분 / ${tempoStr} / Zone 3`];
      case 5: return ['조깅', '30분 / Zone 1 / 회복'];
      case 6: return ['조깅', `${wk.easy}분 / Zone 2`];
      case 0: return ['LSD', `${wk.lsd}km / ${easyStr} / Zone 2`];
    }
  } else if (wk.t === 'taper') {
    switch (dayOfWeek) {
      case 1: return ['조깅', `${wk.easy}분 / Zone 2`];
      case 2: return ['인터벌', `${wk.int} / ${intStr} / Zone 4 (강도 감소)`];
      case 3: return ['조깅', `${wk.easy}분 / Zone 2`];
      case 4: return ['템포런', `${wk.tempo}분 / ${tempoStr} / Zone 3-4`];
      case 5: return ['조깅', '20분 / Zone 1 / 가볍게'];
      case 6: return ['조깅', `${wk.easy}분 / Zone 2`];
      case 0: return ['LSD', `${wk.lsd}km / ${easyStr} / Zone 2`];
    }
  } else {
    switch (dayOfWeek) {
      case 1: return ['조깅', `${wk.easy}분 / Zone 2 / ${easyStr}`];
      case 2: return ['인터벌', `${wk.int} / ${intStr} / Zone 5`];
      case 3: return ['조깅', `${wk.easy}분 / Zone 2`];
      case 4: return ['템포런', `${wk.tempo}분 / ${tempoStr} / Zone 4`];
      case 5: return ['조깅', '30분 / Zone 1 / 회복'];
      case 6: return ['조깅', `${wk.easy}분 / Zone 2 / 내일 LSD 대비`];
      case 0: return ['LSD', `${wk.lsd}km / ${easyStr} / Zone 2`];
    }
  }
}

// 대회 주차: 7일 고정 최적 레이스 준비 (daysToRace: 6→0)
function preRaceWorkout(daysToRace) {
  if (daysToRace === 6) return ['조깅', '40분 / Zone 2'];
  if (daysToRace === 5) return ['조깅', '30분 / Zone 2 / 100m 스트라이드 × 4'];
  if (daysToRace === 4) return ['가벼운 인터벌', '200m × 4세트 / Zone 4 / 다리 살리기'];
  if (daysToRace === 3) return ['조깅', '30분 / Zone 2'];
  if (daysToRace === 2) return ['완전 휴식', '충분한 수면 / 탄수화물 로딩'];
  if (daysToRace === 1) return ['가벼운 조깅', '20분 / Zone 1 / 다리 풀기'];
  return ['조깅', '30분 / Zone 2'];
}

const WEEK_TYPE_LABEL = { build:'빌드', peak:'피크', recover:'회복', taper:'테이퍼' };

function generatePlanData(vdot, targetDist, numWeeks, startDateStr, raceDateOverride, useDynamic = false) {
  const p = getPaces(vdot);
  const paces = {
    easyStr:  `${fmtPace(p.easyF)}-${fmtPace(p.easyS)}/km`,
    tempoStr: `${fmtPace(p.tempoF)}-${fmtPace(p.tempoS)}/km`,
    intStr:   `${fmtPace(p.intF)}-${fmtPace(p.intS)}/km`,
  };
  const startDate = new Date(startDateStr);
  const rows = [];

  if (!useDynamic) {
    // ── 기간 모드: PERIOD_PATTERNS, 대회 주차 없음 ──
    const template = patternToTemplate(PERIOD_PATTERNS[numWeeks], targetDist);
    template.forEach((wk, wi) => {
      const wStart = new Date(startDate);
      wStart.setDate(wStart.getDate() + wi * 7);
      const wEnd = new Date(wStart);
      wEnd.setDate(wEnd.getDate() + 6);
      const dateRange = `${wStart.getMonth()+1}/${wStart.getDate()}-${wEnd.getMonth()+1}/${wEnd.getDate()}`;
      const weekLabel = `${wi+1}주차 · ${WEEK_TYPE_LABEL[wk.t] || '빌드'}`;
      for (let di = 0; di < 7; di++) {
        const date = new Date(wStart);
        date.setDate(date.getDate() + di);
        const dow = date.getDay();
        const [type, detail] = workoutForDay(dow, wk, paces);
        rows.push([wi, di, weekLabel, dateRange, DAYS_KO[dow], type, detail, 'FALSE']);
      }
    });
    return rows;
  }

  // ── 대회일 모드 ──
  const raceDate     = new Date(raceDateOverride);
  const raceTime     = predictTime(vdot, RACE_DIST[targetDist], RACE_FRAC[targetDist]);
  const raceType     = RACE_TYPE[targetDist];

  // 대회 주차: 레이스 당일 포함 정확히 7일 (D-6 ~ D-0)
  const raceWeekStart = new Date(raceDate);
  raceWeekStart.setDate(raceDate.getDate() - 6);

  const totalDays         = Math.floor((raceDate  - startDate)     / 86400000);
  const trainingDays      = totalDays - 6; // 대회 주차 7일을 정확히 붙이려면 -6 (off-by-one 수정)
  const fullTrainingWeeks = Math.floor(trainingDays / 7);
  const partialStartDays  = trainingDays % 7;  // startDate 쪽 남는 일수

  let wi = 0;

  // 시작 부분 부족 일수 처리
  if (partialStartDays > 0) {
    const isWarmup = partialStartDays <= 3;
    const pEnd = new Date(startDate);
    pEnd.setDate(startDate.getDate() + partialStartDays - 1);
    const pRange = `${startDate.getMonth()+1}/${startDate.getDate()}-${pEnd.getMonth()+1}/${pEnd.getDate()}`;
    const pLabel = isWarmup ? '웜업 주차' : `1주차 · 빌드`;
    const firstBuildWk = patternToTemplate(['build'], targetDist)[0];

    for (let di = 0; di < partialStartDays; di++) {
      const date = new Date(startDate);
      date.setDate(startDate.getDate() + di);
      const dow = date.getDay();
      const [type, detail] = isWarmup
        ? ['가벼운 조깅', '30분 / Zone 1-2 / 훈련 준비']
        : workoutForDay(dow, firstBuildWk, paces);
      rows.push([wi, di, pLabel, pRange, DAYS_KO[dow], type, detail, 'FALSE']);
    }
    wi++;
  }

  // 훈련 시작점 (partial days 이후)
  const trainingStart = new Date(startDate);
  trainingStart.setDate(startDate.getDate() + partialStartDays);

  // 훈련 주차 패턴: 빌드·빌드·피크·회복 반복, 마지막 주 = 항상 테이퍼
  const trainingPattern = Array.from({ length: fullTrainingWeeks }, (_, i) =>
    i === fullTrainingWeeks - 1 ? 'taper' : ['build','build','peak','recover'][i % 4]
  );
  const trainingTemplate = patternToTemplate(trainingPattern, targetDist);

  trainingTemplate.forEach((wk, idx) => {
    const wStart = new Date(trainingStart);
    wStart.setDate(trainingStart.getDate() + idx * 7);
    const wEnd = new Date(wStart);
    wEnd.setDate(wEnd.getDate() + 6);
    const dateRange = `${wStart.getMonth()+1}/${wStart.getDate()}-${wEnd.getMonth()+1}/${wEnd.getDate()}`;
    const weekLabel = `${wi+idx+1}주차 · ${WEEK_TYPE_LABEL[wk.t] || '빌드'}`;
    for (let di = 0; di < 7; di++) {
      const date = new Date(wStart);
      date.setDate(date.getDate() + di);
      const dow = date.getDay();
      const [type, detail] = workoutForDay(dow, wk, paces);
      rows.push([wi + idx, di, weekLabel, dateRange, DAYS_KO[dow], type, detail, 'FALSE']);
    }
  });
  wi += fullTrainingWeeks;

  // 대회 주차: 항상 7일, 최적 레이스 준비 (D-6 → D-0)
  const raceWeekRange = `${raceWeekStart.getMonth()+1}/${raceWeekStart.getDate()}-${raceDate.getMonth()+1}/${raceDate.getDate()}`;
  for (let di = 0; di < 7; di++) {
    const date = new Date(raceWeekStart);
    date.setDate(raceWeekStart.getDate() + di);
    const dow  = date.getDay();
    const daysToRace = 6 - di;
    const [type, detail] = daysToRace === 0
      ? [raceType, `목표: ${raceTime} / Zone 3-4 / 초반 페이스 억제`]
      : preRaceWorkout(daysToRace);
    rows.push([wi, di, '대회 주차', raceWeekRange, DAYS_KO[dow], type, detail, 'FALSE']);
  }

  return rows;
}

let plans = [], currentPlanId = null, allData = [], weekMap = {};

function loadPlans() {
  try { return JSON.parse(localStorage.getItem(PLANS_KEY)) || []; } catch(e) { return []; }
}

function migrate() {
  if (localStorage.getItem(PLANS_KEY)) return;
  let data;
  try { const l = localStorage.getItem(LEGACY_KEY); data = l ? JSON.parse(l) : DEFAULT_DATA.map(r=>[...r]); }
  catch(e) { data = DEFAULT_DATA.map(r=>[...r]); }
  plans = [{ id: Date.now(), title: '2026 봄 하프마라톤', createdAt: '2026-05-12', data }];
  savePlans();
}

// ── List render ───────────────────────────────────────

function renderList() {
  const el = document.getElementById('planListContainer');
  if (!plans.length) {
    el.innerHTML = '<div class="empty-state">플랜이 없어요.<br>새 플랜을 만들어보세요.</div>';
    return;
  }
  el.innerHTML = plans.map(plan => {
    const total = plan.data.length;
    const done = plan.data.filter(r => r[7]==='TRUE').length;
    const pct = total ? Math.round(done/total*100) : 0;
    const weekCount = new Set(plan.data.map(r=>r[0])).size;
    const dateRows = plan.data.filter(r => String(r[3]).includes('-'));
    const first = dateRows.length ? String(dateRows[0][3]).split('-')[0] : '';
    const last = dateRows.length ? String(dateRows[dateRows.length-1][3]).split('-')[1] : '';
    const meta = total ? `${first && last ? first+' – '+last+' · ' : ''}${weekCount}주 · ${done}/${total} 완료` : '운동 없음';
    return `<div class="plan-card" onclick="showDetail(${plan.id})">
      <div class="plan-card-body">
        <div class="plan-card-title">${plan.title}</div>
        <div class="plan-card-meta">${meta}</div>
        <div class="plan-card-bar-wrap"><div class="plan-card-bar" style="width:${pct}%"></div></div>
      </div>
      <span class="plan-card-chev">›</span>
    </div>`;
  }).join('');
}

// ── Create form ───────────────────────────────────────

function updateWeeksOptions() {
  const sel = document.getElementById('numWeeks');
  sel.innerHTML = WEEKS_OPTIONS.map(w => `<option value="${w}">${w}주</option>`).join('');
}

function updatePreview() {
  const dist = parseInt(document.getElementById('raceDist').value);
  const h = parseInt(document.getElementById('raceH').value) || 0;
  const m = parseInt(document.getElementById('raceM').value) || 0;
  const s = parseInt(document.getElementById('raceS').value) || 0;
  const totalSec = h*3600 + m*60 + s;
  if (!totalSec || totalSec < 60) {
    document.getElementById('vdotPreview').style.display = 'none';
    document.getElementById('btnGenerate').disabled = true;
    return;
  }
  const vdot = calcVDOT(dist, totalSec);
  if (vdot < 20 || vdot > 85) {
    document.getElementById('vdotPreview').style.display = 'none';
    document.getElementById('btnGenerate').disabled = true;
    return;
  }
  const p = getPaces(vdot);
  document.getElementById('vdotVal').textContent = vdot;
  document.getElementById('pEasy').textContent = `${fmtPace(p.easyF)}-${fmtPace(p.easyS)}/km`;
  document.getElementById('pTempo').textContent = `${fmtPace(p.tempoF)}-${fmtPace(p.tempoS)}/km`;
  document.getElementById('pInterval').textContent = `${fmtPace(p.intF)}-${fmtPace(p.intS)}/km`;
  document.getElementById('vdotPreview').style.display = 'block';
  document.getElementById('btnGenerate').disabled = false;
}

function generateNewPlan() {
  const dist = parseInt(document.getElementById('raceDist').value);
  const h = parseInt(document.getElementById('raceH').value)||0;
  const m = parseInt(document.getElementById('raceM').value)||0;
  const s = parseInt(document.getElementById('raceS').value)||0;
  const vdot = calcVDOT(dist, h*3600+m*60+s);
  const targetDist = document.getElementById('targetDist').value;
  const startDate = document.getElementById('startDate').value || new Date().toISOString().split('T')[0];
  const title = document.getElementById('newTitle').value.trim() || '새 플랜';

  let numWeeks;
  let raceDateOverride = null;
  if (periodMode === 'date') {
    const raceDateStr = document.getElementById('raceDate').value;
    if (!raceDateStr) {
      showSnackbar('대회 날짜를 선택해주세요');
      return;
    }
    const raceDate = new Date(raceDateStr);
    const start = new Date(startDate);
    if (raceDate <= start) {
      showSnackbar('대회일이 시작일보다 앞에 있어요');
      return;
    }
    // 대회 주차는 항상 7일 (D-6~D-0) → off-by-one 없이 붙이려면 -6
    const totalDays    = Math.floor((raceDate - start) / 86400000);
    const trainingDays = totalDays - 6;
    const fullTrainingWeeks = Math.floor(trainingDays / 7);

    const minWeeks = MIN_TRAINING_WEEKS[targetDist];
    if (fullTrainingWeeks < minWeeks) {
      showSnackbar(`${RACE_TYPE[targetDist]} 플랜은 최소 ${minWeeks + 1}주 필요해요`);
      return;
    }
    numWeeks = fullTrainingWeeks; // generatePlanData 내부에서 활용
    raceDateOverride = raceDateStr;
  } else {
    numWeeks = parseInt(document.getElementById('numWeeks').value);
  }

  const data = generatePlanData(vdot, targetDist, numWeeks, startDate, raceDateOverride, periodMode === 'date');
  const plan = { id: Date.now(), title, createdAt: startDate, data };
  plans.push(plan);
  savePlans();
  showDetail(plan.id, false); // history는 replaceState로 처리
  history.replaceState({ screen: 'detail', planId: plan.id }, '');
  window.scrollTo({ top: 0, behavior: 'instant' });
  showSnackbar(`${data.length}일간의 플랜이 생성되었어요`);
}

function savePlanTitle() {
  const plan = plans.find(p => p.id === currentPlanId);
  if (!plan) return;
  plan.title = document.getElementById('titleInput').value.trim() || '이름 없는 플랜';
  savePlans();
}

function deletePlan() {
  if (!confirm('이 플랜을 삭제하시겠어요? 되돌릴 수 없습니다.')) return;
  plans = plans.filter(p => p.id !== currentPlanId);
  savePlans();
  showList();
}

// ── Detail render ─────────────────────────────────────

function buildWeekMap() {
  weekMap = {};
  allData.forEach(row => {
    const wi = row[0];
    if (!weekMap[wi]) weekMap[wi] = { label: row[2], date: row[3], days: [] };
    weekMap[wi].days.push({ di: row[1], day: row[4], type: row[5], detail: row[6], checked: row[7]==='TRUE' });
  });
}

function getBadge(label) {
  if (label.includes('대회'))  return ['race',   '레이스'];
  if (label.includes('회복'))  return ['recover', '회복'];
  if (label.includes('테이퍼')) return ['taper',   '테이퍼'];
  if (label.includes('피크'))  return ['peak',    '피크'];
  return ['build', '빌드업'];
}

function render() {
  const app = document.getElementById('app');
  const wiKeys = Object.keys(weekMap).sort((a,b)=>a-b);
  if (!wiKeys.length) { app.innerHTML = '<div class="loading-screen">아직 운동이 없어요</div>'; return; }

  let html = `<div class="vdot-box"><div class="vdot-title">훈련 페이스 참고</div><div class="vdot-grid">
    <div class="vdot-item">Easy <span>${getVdotNote('easy')}</span></div>
    <div class="vdot-item">Tempo <span>${getVdotNote('tempo')}</span></div>
    <div class="vdot-item">Interval <span>${getVdotNote('interval')}</span></div>
    <div class="vdot-item">예상 기록 <span>${getVdotNote('race')}</span></div>
  </div></div>`;

  wiKeys.forEach(wi => {
    const w = weekMap[wi];
    const done = w.days.filter(d=>d.checked).length;
    const [badgeClass, badgeText] = getBadge(w.label);
    const isOpen = wi == wiKeys[0] ? 'open' : '';
    html += `<div class="week-block">
      <div class="week-header" onclick="toggleWeek(${wi})">
        <div style="flex:1"><div class="week-title">${w.label} <span class="week-date">${w.date}</span></div></div>
        <span class="badge badge-${badgeClass}">${badgeText}</span>
        <span class="week-progress" id="wp-${wi}">${done}/${w.days.length}</span>
        <span class="chev ${isOpen}" id="chev-${wi}">▾</span>
      </div>
      <div class="week-body ${isOpen}" id="body-${wi}">
        ${w.days.map(d => {
          const tag = TYPE_TAG[d.type]||'jog';
          return `<div class="day-row ${d.checked?'done':''}" id="row-${wi}-${d.di}">
            <div class="checkbox ${d.checked?'checked':''}" id="cb-${wi}-${d.di}" onclick="toggleCheck(${wi},${d.di})"></div>
            <div class="day-label">${d.day}</div>
            <div class="day-content">
              <div class="day-type"><span class="tag tag-${tag}">${d.type}</span></div>
              <div class="day-detail">${d.detail}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  });

  html += `<button class="btn-delete" onclick="deletePlan()">플랜 삭제</button>`;
  app.innerHTML = html;
}

function getVdotNote(type) {
  // Extract pace info from first workout of relevant type
  for (const row of allData) {
    const detail = row[6] || '';
    if (type==='easy' && row[5]==='LSD') { const m = detail.match(/[\d:]+\/km/); if(m) return m[0]; }
    if (type==='tempo' && row[5]==='템포런') { const m = detail.match(/[\d:]+-[\d:]+\/km/); if(m) return m[0]; }
    if (type==='interval' && row[5]==='인터벌') { const m = detail.match(/[\d:]+-[\d:]+\/km/); if(m) return m[0]; }
    if (type==='race' && (row[5]==='하프마라톤'||row[5]==='10K 레이스'||row[5]==='5K 레이스'||row[5]==='풀마라톤')) {
      const m = detail.match(/[\d:]+:[0-9]{2}/); if(m) return m[0];
    }
  }
  return '-';
}

function toggleWeek(wi) {
  document.getElementById('body-'+wi).classList.toggle('open');
  document.getElementById('chev-'+wi).classList.toggle('open');
}

function toggleCheck(wi, di) {
  const cb = document.getElementById('cb-'+wi+'-'+di);
  const row = document.getElementById('row-'+wi+'-'+di);
  const nowChecked = !cb.classList.contains('checked');
  cb.classList.toggle('checked', nowChecked);
  row.classList.toggle('done', nowChecked);
  const entry = weekMap[wi].days.find(d=>d.di==di);
  if (entry) entry.checked = nowChecked;
  const dataRow = allData.find(r=>r[0]==wi&&r[1]==di);
  if (dataRow) dataRow[7] = nowChecked?'TRUE':'FALSE';
  saveCurrentPlan();
  document.getElementById('wp-'+wi).textContent =
    weekMap[wi].days.filter(d=>d.checked).length + '/' + weekMap[wi].days.length;
  updateTotalProgress();
}

function saveCurrentPlan() {
  const plan = plans.find(p=>p.id===currentPlanId);
  if (plan) { plan.data = allData; savePlans(); }
}

function updateTotalProgress() {
  let done=0, total=0;
  Object.values(weekMap).forEach(w=>{ done+=w.days.filter(d=>d.checked).length; total+=w.days.length; });
  document.getElementById('totalProgress').style.width = (total?Math.round(done/total*100):0)+'%';
}

// ── Init ──────────────────────────────────────────────
migrate();
plans = loadPlans();
const beforeCount = plans.length;
plans = plans.filter(p => p.data && p.data.length > 0);
if (plans.length !== beforeCount) savePlans();

// 브라우저 뒤로가기 연동
window.addEventListener('popstate', (e) => {
  const state = e.state || {};
  if (state.screen === 'detail' && state.planId) {
    showDetail(state.planId, false);
  } else {
    showList();
  }
});

// 초기 상태 등록
history.replaceState({ screen: 'list' }, '');
showList();
</script>
</body>
</html>
